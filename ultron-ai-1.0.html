<!doctype html><nhtml lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>ULTRON AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f2f4f7;font:15px Arial,sans-serif;height:100vh;display:flex}button,textarea{font:inherit}.side{width:270px;background:#0e1014;border-right:1px solid #292e36;padding:18px;display:flex;flex-direction:column}.brand{font-size:19px;letter-spacing:3px;padding:8px 4px 25px}.brand b{color:#cbd1da}.new{padding:12px;background:#1b2027;border:1px solid #555e6a;border-radius:9px;color:white;text-align:left}.label{font-size:10px;letter-spacing:2px;color:#858d99;margin:25px 5px 10px}.history{flex:1;overflow:auto}.item{padding:10px;border-radius:8px;color:#c5cbd4;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item:hover,.item.active{background:#20252d}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:60px;border-bottom:1px solid #292e36;display:flex;align-items:center;padding:0 22px;letter-spacing:2px;font-weight:bold}.content{flex:1;overflow:auto;padding:25px}.welcome{text-align:center;margin:9vh auto 0;max-width:650px}.orb{font-size:43px;border:1px solid #9ba4b1;border-radius:20px;width:75px;height:75px;display:grid;place-items:center;margin:auto auto 20px;color:#dce1e8}.welcome h1{letter-spacing:5px}.welcome p{color:#929aa6}.suggest{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:28px auto}.suggest button{background:#12161b;border:1px solid #303640;color:#cbd1da;border-radius:10px;padding:14px;text-align:left}.messages{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:16px}.msg{padding:13px 16px;border:1px solid #303640;border-radius:12px;background:#15191f;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#242a33}.composer{padding:12px 20px 18px}.entry{max-width:760px;margin:auto;display:flex;gap:10px;padding:10px;border:1px solid #424a56;border-radius:14px;background:#12161b}.entry textarea{flex:1;resize:none;min-height:30px;max-height:120px;background:none;color:white;border:0;outline:0}.entry button{width:38px;border:0;border-radius:9px;background:#d5dae1;color:#101216;font-size:20px}.hint{text-align:center;color:#68717e;font-size:10px;margin-top:8px}@media(max-width:650px){.side{width:115px;padding:10px}.brand{font-size:14px;letter-spacing:1px}.suggest{grid-template-columns:1fr}.content{padding:15px}.top{padding:0 14px}}
</style></head><body><aside class="side"><div class="brand">◉ <b>ULTRON</b></div><button class="new" id="new">＋ Nova conversa</button><div class="label">HISTÓRICO</div><div class="history" id="history"></div><div class="label">PROTÓTIPO 1.0</div></aside><main class="main"><header class="top">ULTRON AI　 <span style="font-size:10px;color:#8e98a5">INTERFACE 1.0</span></header><section class="content" id="content"><div class="welcome" id="welcome"><div class="orb">◉</div><h1>ULTRON</h1><p>Uma nova inteligência está sendo construída.</p><div class="suggest"><button data-q="Explique um assunto difícil de forma simples.">✧ Explique algo difícil</button><button data-q="Me ajude a organizar minhas ideias.">⌘ Organize minhas ideias</button><button data-q="Crie um plano de estudos para mim.">▤ Plano de estudos</button><button data-q="Me dê ideias para um projeto.">✳ Gere ideias</button></div></div><div class="messages" id="messages"></div></section><footer class="composer"><div class="entry"><textarea id="input" rows="1" placeholder="Envie uma mensagem para ULTRON..."></textarea><button id="send">↑</button></div><div class="hint">Protótipo de interface — o modelo de IA ainda não está conectado.</div></footer></main><script>
let chats=JSON.parse(localStorage.getItem('ultron_chats')||'[]'),active=null;const $=s=>document.querySelector(s);function persist(){localStorage.setItem('ultron_chats',JSON.stringify(chats));drawHistory()}function fresh(){active={id:Date.now(),title:'Nova conversa',messages:[]};chats.unshift(active);persist();draw();}function drawHistory(){let h=$('#history');h.innerHTML='';chats.forEach(c=>{let b=document.createElement('div');b.className='item'+(active&&active.id===c.id?' active':'');b.textContent=c.title;b.onclick=()=>{active=c;draw();drawHistory()};h.append(b)})}function draw(){let w=$('#welcome'),m=$('#messages');w.style.display=active&&active.messages.length?'none':'block';m.innerHTML='';if(active)active.messages.forEach(x=>{let d=document.createElement('div');d.className='msg '+x.role;d.textContent=x.text;m.append(d)});$('#content').scrollTop=$('#content').scrollHeight}function send(t){let v=(t||$('#input').value).trim();if(!v)return;if(!active)fresh();active.messages.push({role:'user',text:v});if(active.title==='Nova conversa')active.title=v.slice(0,36);active.messages.push({role:'assistant',text:'Esta é a interface inicial da ULTRON. O histórico fica salvo neste navegador. A conexão com o modelo de IA será adicionada na próxima etapa, com a chave protegida.'});$('#input').value='';persist();draw()}$('#new').onclick=fresh;$('#send').onclick=()=>send();$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));drawHistory();draw();
</script></body></html>
