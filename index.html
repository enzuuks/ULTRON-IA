<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090a0d;
  color: #e5e7eb;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
}
.sidebar {
  width: 250px;
  background: #101216;
  border-right: 1px solid #292d33;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo {
  width: 40px; height: 40px;
  border: 2px solid #c0c4ca;
  border-radius: 50%;
  display:grid; place-items:center;
  color:#d9dde2;
  font-size:20px;
}
.brand strong { font-size:18px; letter-spacing:2px; }
button {
  cursor:pointer;
  color:inherit;
  background:transparent;
  border:0;
}
.new-chat {
  background:#20242a;
  border:1px solid #41464e;
  padding:13px;
  border-radius:9px;
  text-align:left;
}
.section { color:#777f8a; font-size:11px; letter-spacing:2px; }
.history { color:#bfc4cc; padding:9px 4px; font-size:13px; }
.profile {
  margin-top:auto;
  border-top:1px solid #292d33;
  padding-top:18px;
  color:#c4c9d0;
}
.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar {
  height:65px;
  border-bottom:1px solid #292d33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}
.status { color:#aeb4bc; font-size:12px; }
.center {
  flex:1;
  overflow-y:auto;
  width:100%;
  max-width:850px;
  margin:auto;
  padding:35px 25px;
  display:flex;
  flex-direction:column;
  gap:22px;
}
.welcome {
  text-align:center;
  margin:35px 0 15px;
}
.big-logo {
  width:82px; height:82px;
  border:2px solid #c0c4ca;
  border-radius:50%;
  background:#08090b;
  display:grid;
  place-items:center;
  margin:auto auto 18px;
  font-size:38px;
}
.welcome h1 {
  letter-spacing:5px;
  font-size:27px;
  margin:0;
}
.welcome p {
  color:#858d98;
  font-size:11px;
  letter-spacing:3px;
}
.message {
  max-width:80%;
  padding:14px 17px;
  border-radius:12px;
  line-height:1.5;
  font-size:14px;
}
.bot { background:#1b1e23; align-self:flex-start; }
.user { background:#30343a; align-self:flex-end; }
.composer {
  width:100%;
  max-width:850px;
  margin:0 auto 25px;
  padding:0 25px;
}
.input-box {
  background:#191c21;
  border:1px solid #555b64;
  border-radius:13px;
  padding:12px 15px;
}
textarea {
  width:100%;
  resize:none;
  background:transparent;
  color:white;
  border:0;
  outline:0;
  font:14px Arial;
  min-height:35px;
}
.actions {
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aeb4bc;
}
.send {
  background:#d1d5db;
  color:#111318;
  border-radius:8px;
  padding:9px 15px;
  font-weight:bold;
}
.footer {
  text-align:center;
  color:#737b85;
  font-size:10px;
  padding-bottom:12px;
}
@media(max-width:650px) {
  .sidebar { width:65px; padding:12px 8px; align-items:center; }
  .brand strong,.section,.history,.profile span { display:none; }
  .new-chat { text-align:center; padding:12px 8px; }
  .topbar { padding:0 14px; }
  .center { padding:20px 14px; }
  .composer { padding:0 12px; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">◉</div>
    <strong>ULTRON</strong>
  </div>

  <button class="new-chat" onclick="newChat()">＋ Nova conversa</button>

  <div class="section">HISTÓRICO</div>
  <div id="history"></div>

  <div class="profile">◉ <span>Meu perfil</span></div>
</aside>

<main class="main">
  <header class="topbar">
    <strong>ULTRON AI</strong>
    <div class="status">● SISTEMA</div>
  </header>

  <section class="center" id="messages">
    <div class="welcome" id="welcome">
      <div class="big-logo">◉</div>
      <h1>ULTRON</h1>
      <p>INTELIGÊNCIA ARTIFICIAL AVANÇADA</p>
    </div>
    <div class="message bot">
      Olá. Sou o ULTRON. Estou pronto para iniciar uma conversa.
    </div>
  </section>

  <div class="composer">
    <div class="input-box">
      <textarea id="input" placeholder="Converse com o ULTRON..."
      rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <div class="actions">
        <span>＋ &nbsp; ◉</span>
        <button class="send" onclick="sendMessage()">Enviar ↑</button>
      </div>
    </div>
  </div>

  <div class="footer">ULTRON AI • PRETO E PRATA</div>
</main>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");
  const text = input.value.trim();
  if (!text) return;

  document.getElementById("welcome").style.display = "none";

  const bubble = document.createElement("div");
  bubble.className = "message user";
  bubble.textContent = text;
  messages.appendChild(bubble);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  const history = document.getElementById("history");
  const item = document.createElement("div");
  item.className = "history";
  item.textContent = text.slice(0, 25);
  history.prepend(item);
}

function newChat() {
  document.getElementById("messages").innerHTML = `
    <div class="welcome" id="welcome">
      <div class="big-logo">◉</div>
      <h1>ULTRON</h1>
      <p>INTELIGÊNCIA ARTIFICIAL AVANÇADA</p>
    </div>
    <div class="message bot">
      Nova conversa iniciada. Estou pronto.
    </div>`;
}
</script>

</body>
</html>
